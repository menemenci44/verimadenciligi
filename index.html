<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İşbirlikçi Filtreleme Çalışma Sitesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --paper:#fffdf8; --ink:#1f2328; --muted:#5d6470; --line:#e4ddd0;
  --accent:#1d5c63; --accent-soft:#e3efee; --warm:#b5562c; --warm-soft:#f8e9e0;
  --ok:#2e7d4f; --ok-soft:#e4f3ea; --bad:#b3261e; --bad-soft:#fbe7e5;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px;line-height:1.55}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
aside{background:#1b2a2f;color:#e9efe9;padding:26px 18px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-family:'Fraunces',serif;font-size:22px;line-height:1.2;margin:0 0 4px;font-weight:700}
aside .sub{font-size:13px;color:#9fb3b0;margin-bottom:22px}
nav button{all:unset;display:flex;align-items:center;gap:10px;width:100%;padding:10px 10px;border-radius:9px;cursor:pointer;font-size:14.5px;color:#d7e2de;box-sizing:border-box}
nav button:hover{background:#26393f}
nav button.active{background:#e3efee;color:#1b2a2f;font-weight:600}
nav .num{font-family:var(--mono);font-size:12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#2f454b;flex:none}
nav button.active .num{background:var(--accent);color:#fff}
nav .prog{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:#9fb3b0}
nav button.active .prog{color:var(--accent)}
nav .home{margin-bottom:8px}
.total{margin-top:22px;padding:14px;border:1px solid #33494f;border-radius:10px;font-size:13px;color:#b8c9c5}
.total b{font-family:var(--mono);color:#fff;font-size:18px}
.bar{height:6px;background:#33494f;border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#7cc4b8;width:0;transition:width .3s}
main{padding:38px clamp(18px,4vw,56px) 80px;max-width:1000px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--warm)}
h2.title{font-family:'Fraunces',serif;font-size:clamp(30px,4vw,42px);line-height:1.1;margin:6px 0 10px}
.lead{font-size:18px;color:var(--muted);max-width:720px;margin:0 0 26px}
section.block{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin:0 0 22px}
section.block h3{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:8px}
section.block h3 .tag{font-family:var(--mono);font-size:11px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:20px;font-weight:500}
.formula{font-family:var(--mono);font-size:17px;background:#1b2a2f;color:#f2f6f4;padding:16px 18px;border-radius:10px;overflow-x:auto;margin:6px 0 10px}
.formula small{display:block;color:#9fb3b0;font-size:12.5px;margin-top:6px;font-family:'IBM Plex Sans',sans-serif}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.when{border-left:4px solid var(--accent);padding:4px 0 4px 14px}
.when.no{border-color:var(--warm)}
.when h4{margin:0 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.when.no h4{color:var(--warm)}
.when ul{margin:0;padding-left:18px}
.when li{margin:3px 0}
.qtypes{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.qtypes span{background:var(--warm-soft);color:#7a3a1c;font-size:13.5px;padding:5px 10px;border-radius:8px}
details.ex{border:1px solid var(--line);border-radius:11px;margin:10px 0;background:#fff;overflow:hidden}
details.ex summary{cursor:pointer;padding:13px 16px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
details.ex summary::-webkit-details-marker{display:none}
details.ex summary .k{font-family:var(--mono);font-size:11.5px;color:#fff;background:var(--warm);border-radius:6px;padding:2px 7px;font-weight:500}
details.ex summary::after{content:'+';margin-left:auto;font-family:var(--mono);color:var(--muted);font-size:18px}
details.ex[open] summary::after{content:'−'}
details.ex .body{padding:0 18px 16px}
.src{font-size:12px;color:var(--muted);font-family:var(--mono)}
table.t{border-collapse:collapse;margin:10px 0;font-size:14.5px;width:auto;min-width:50%}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 12px;text-align:left}
table.t th{background:#f3efe6;font-weight:600}
table.t td.n,table.t th.n{text-align:right;font-family:var(--mono)}
table.t tr.hl td{background:var(--ok-soft);font-weight:600}
.step{font-family:var(--mono);font-size:14.5px;background:#f7f4ee;border-radius:8px;padding:10px 14px;margin:8px 0;white-space:pre-wrap;overflow-x:auto}
.note{background:var(--warm-soft);border-radius:9px;padding:10px 14px;font-size:14.5px;margin:10px 0}
.note.ok{background:var(--accent-soft)}
pre.code{font-family:var(--mono);font-size:13.5px;background:#1b2a2f;color:#e9efe9;padding:14px 16px;border-radius:10px;overflow-x:auto;line-height:1.5}
pre.code .c{color:#8fb3a9}
/* calculator */
.calc label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.calc input[type=text],.calc input[type=number]{width:100%;font-family:var(--mono);font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
.calc .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.calc .row3{display:grid;grid-template-columns:1fr 1fr 120px;gap:12px;margin-bottom:10px}
.btn{all:unset;cursor:pointer;background:var(--accent);color:#fff;font-weight:600;font-size:14.5px;padding:9px 16px;border-radius:9px}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:focus-visible,nav button:focus-visible{outline:3px solid #7cc4b8;outline-offset:2px}
.out{margin-top:12px}
.pill{display:inline-block;font-family:var(--mono);background:var(--accent);color:#fff;padding:4px 10px;border-radius:7px;font-size:15px}
select{font-family:inherit;font-size:15px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#fff}
/* quiz */
.q{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0;background:#fff}
.q .qh{display:flex;gap:10px;align-items:flex-start}
.q .qn{font-family:var(--mono);font-size:12px;background:#1b2a2f;color:#fff;border-radius:6px;padding:2px 8px;flex:none;margin-top:3px}
.q .qt{font-weight:500}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:15px;background:#fbfaf6}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:#174d2f;font-weight:600}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:#7d1a14}
.opt[disabled]{cursor:default}
.numrow{display:flex;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap}
.numrow input{font-family:var(--mono);font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;width:160px}
.fb{margin-top:10px;font-size:14.5px;padding:10px 12px;border-radius:9px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px}
.qbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;flex-wrap:wrap;gap:8px}
.score{font-family:var(--mono);font-size:14px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{all:unset;cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px;box-sizing:border-box}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card .cn{font-family:var(--mono);font-size:12px;color:var(--warm)}
.card .ct{font-family:'Fraunces',serif;font-size:21px;font-weight:700}
.card .cd{font-size:14px;color:var(--muted)}
.card .cm{font-family:var(--mono);font-size:12px;color:var(--accent);margin-top:auto}
.navfoot{display:flex;justify-content:space-between;margin-top:30px;gap:10px}
.menu-toggle{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  aside{position:static;height:auto}
  nav{display:none}
  nav.open{display:block}
  .menu-toggle{display:inline-block;margin-bottom:8px}
  .grid2,.calc .row,.calc .row3{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="layout">
<aside>
  <h1>İşbirlikçi Filtreleme</h1>
  <div class="sub">Veri Madenciliği · Bölüm 2 çalışma sitesi</div>
  <button class="btn ghost menu-toggle" onclick="document.querySelector('nav').classList.toggle('open')" style="color:#e3efee;border-color:#e3efee">Kategoriler</button>
  <nav id="nav"></nav>
  <div class="total">Toplam ilerleme<br><b id="totalScore">0 / 0</b> doğru<div class="bar"><i id="totalBar"></i></div>
    <div style="margin-top:10px"><button class="btn ghost" style="color:#e3efee;border-color:#55706f;font-size:12.5px;padding:5px 10px" onclick="resetAll()">Cevapları sıfırla</button></div>
  </div>
</aside>
<main id="main"></main>
</div>

<script>
/* ---------- veri seti (PDF) ---------- */
const USERS = {
 "Angelica":{"Blues Traveler":3.5,"Broken Bells":2.0,"Norah Jones":4.5,"Phoenix":5.0,"Slightly Stoopid":1.5,"The Strokes":2.5,"Vampire Weekend":2.0},
 "Bill":{"Blues Traveler":2.0,"Broken Bells":3.5,"Deadmau5":4.0,"Phoenix":2.0,"Slightly Stoopid":3.5,"Vampire Weekend":3.0},
 "Chan":{"Blues Traveler":5.0,"Broken Bells":1.0,"Deadmau5":1.0,"Norah Jones":3.0,"Phoenix":5,"Slightly Stoopid":1.0},
 "Dan":{"Blues Traveler":3.0,"Broken Bells":4.0,"Deadmau5":4.5,"Phoenix":3.0,"Slightly Stoopid":4.5,"The Strokes":4.0,"Vampire Weekend":2.0},
 "Hailey":{"Broken Bells":4.0,"Deadmau5":1.0,"Norah Jones":4.0,"The Strokes":4.0,"Vampire Weekend":1.0},
 "Jordyn":{"Broken Bells":4.5,"Deadmau5":4.0,"Norah Jones":5.0,"Phoenix":5.0,"Slightly Stoopid":4.5,"The Strokes":4.0,"Vampire Weekend":4.0},
 "Sam":{"Blues Traveler":5.0,"Broken Bells":2.0,"Norah Jones":3.0,"Phoenix":5.0,"Slightly Stoopid":4.0,"The Strokes":5.0},
 "Veronica":{"Blues Traveler":3.0,"Norah Jones":5.0,"Phoenix":4.0,"Slightly Stoopid":2.5,"The Strokes":3.0}
};
const BANDS=["Blues Traveler","Broken Bells","Deadmau5","Norah Jones","Phoenix","Slightly Stoopid","The Strokes","Vampire Weekend"];
const NAMES=Object.keys(USERS);

/* ---------- metrikler ---------- */
function minkowski(a,b,r){let d=0,c=false;for(const k in a){if(k in b){d+=Math.pow(Math.abs(a[k]-b[k]),r);c=true}}return c?Math.pow(d,1/r):0}
function manhattan(a,b){return minkowski(a,b,1)}
function pearson(a,b){let sxy=0,sx=0,sy=0,sx2=0,sy2=0,n=0;for(const k in a){if(k in b){n++;const x=a[k],y=b[k];sxy+=x*y;sx+=x;sy+=y;sx2+=x*x;sy2+=y*y}}
 if(!n)return 0;const den=Math.sqrt(sx2-sx*sx/n)*Math.sqrt(sy2-sy*sy/n);return den===0?0:(sxy-sx*sy/n)/den}
function cosine(a,b){let dot=0,na=0,nb=0;for(const k of BANDS){const x=a[k]||0,y=b[k]||0;dot+=x*y;na+=x*x;nb+=y*y}return (na&&nb)?dot/Math.sqrt(na*nb):0}
const f=(x,d=3)=>{if(!isFinite(x))return '—';const s=(Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toString();return s.replace('.',',')};

function ratingTable(names){
  let h='<table class="t"><tr><th></th>'+names.map(n=>`<th class="n">${n}</th>`).join('')+'</tr>';
  for(const b of BANDS){h+=`<tr><td>${b}</td>`+names.map(n=>`<td class="n">${USERS[n][b]!==undefined?f(USERS[n][b],1):'–'}</td>`).join('')+'</tr>'}
  return h+'</table>';
}

/* ---------- içerik ---------- */
const CATS=[
{
 id:'manhattan', title:'Manhattan uzaklığı', short:'Mutlak farkların toplamı. En hızlı, en basit uzaklık.',
 lead:'İki kişinin her öğedeki puan farkının mutlak değerleri toplanır. Adını, ızgara şeklindeki sokaklarda yalnızca yatay ve dikey gidilen taksi yolundan alır (cab driver distance).',
 formula:'d(x, y) = |x₁ − x₂| + |y₁ − y₂|      (2 boyut)<br>d(x, y) = Σ |xₖ − yₖ|              (n boyut)<small>Yalnızca iki kişinin de puanladığı öğeler toplanır. Küçük d = daha benzer.</small>',
 when:['Veri yoğun (herkes hemen her şeyi puanlamış)','Hız önemli: 1 milyon kullanıcı içinden en benzer kişiyi bulmak','Puanlar aynı ölçekte (ör. 1–5 yıldız)','Tek bir büyük farkın sonucu şişirmesi istenmiyor'],
 whenNot:['Veri seyrek (çoğu hücre boş)','Kullanıcılar ölçeği farklı kullanıyor (puan enflasyonu)','Ortak öğe sayısı kişiden kişiye çok değişiyor'],
 qtypes:['“X ile Y arasındaki Manhattan uzaklığını hesaplayın”','“Ms. X’e en yakın kişi kim?”','“manhattan() fonksiyonu ne döndürür?”','“En yakın komşu listesini sıralayın”'],
 calc:'pair', calcDefault:['5, 5','4, 2'], calcMetric:'manhattan',
 examples:[
  {t:'Ms. X’e en yakın okuyucu (2 boyut)', src:'PDF s. 2-3', b:`Ms. X: Snow Crash 4, Dragon Tattoo 2.
  <table class="t"><tr><th>Kişi</th><th class="n">Snow Crash</th><th class="n">Dragon Tattoo</th><th>Hesap</th><th class="n">d</th></tr>
  <tr class="hl"><td>Amy</td><td class="n">5</td><td class="n">5</td><td>|5−4| + |5−2|</td><td class="n">4</td></tr>
  <tr><td>Bill</td><td class="n">2</td><td class="n">5</td><td>|2−4| + |5−2|</td><td class="n">5</td></tr>
  <tr><td>Jim</td><td class="n">1</td><td class="n">4</td><td>|1−4| + |4−2|</td><td class="n">5</td></tr></table>
  En yakın Amy. Amy <i>The Windup Girl</i>’e 5 vermiş, bu kitap Ms. X’e önerilir.`},
  {t:'Angelica ile Bill (n boyut)', src:'PDF s. 2-7', b:`Sadece ikisinin de puanladığı 5 grup kullanılır.
  <table class="t"><tr><th>Grup</th><th class="n">Angelica</th><th class="n">Bill</th><th class="n">|fark|</th></tr>
  <tr><td>Blues Traveler</td><td class="n">3,5</td><td class="n">2</td><td class="n">1,5</td></tr>
  <tr><td>Broken Bells</td><td class="n">2</td><td class="n">3,5</td><td class="n">1,5</td></tr>
  <tr><td>Deadmau5</td><td class="n">–</td><td class="n">4</td><td class="n"></td></tr>
  <tr><td>Norah Jones</td><td class="n">4,5</td><td class="n">–</td><td class="n"></td></tr>
  <tr><td>Phoenix</td><td class="n">5</td><td class="n">2</td><td class="n">3</td></tr>
  <tr><td>Slightly Stoopid</td><td class="n">1,5</td><td class="n">3,5</td><td class="n">2</td></tr>
  <tr><td>The Strokes</td><td class="n">2,5</td><td class="n">–</td><td class="n"></td></tr>
  <tr><td>Vampire Weekend</td><td class="n">2</td><td class="n">3</td><td class="n">1</td></tr>
  <tr class="hl"><td>Toplam</td><td></td><td></td><td class="n">9</td></tr></table>`},
  {t:'Hailey’nin uzaklıkları (Python çıktısı)', src:'PDF s. 2-15', b:`<div class="step">&gt;&gt;&gt; manhattan(users['Hailey'], users['Veronica'])
2.0
&gt;&gt;&gt; manhattan(users['Hailey'], users['Jordyn'])
7.5</div>Veronica ile sadece 2 ortak grup var (Norah Jones, The Strokes): |4−5| + |4−3| = 2. Jordyn ile 5 ortak grup var: 0,5 + 3 + 1 + 0 + 3 = 7,5.`},
  {t:'Yeni örnek: üç arkadaş', src:'Alıştırma', b:`Zeynep iki filme (4, 2) puan vermiş.
  <div class="step">Ali    (3, 5) → |3−4| + |5−2| = 1 + 3 = 4
Ayşe   (4, 1) → |4−4| + |1−2| = 0 + 1 = 1   ← en yakın
Mehmet (1, 4) → |1−4| + |4−2| = 3 + 2 = 5</div>`},
  {t:'Yeni örnek: 3 boyut', src:'Alıştırma', b:`A = (5, 3, 1), B = (2, 4, 1)
  <div class="step">d = |5−2| + |3−4| + |1−1| = 3 + 1 + 0 = 4</div>Boyut sayısı arttıkça aynı mantık devam eder, yalnızca daha çok terim toplanır.`},
  {t:'Python kodu', src:'PDF s. 2-15', b:`<pre class="code">def manhattan(rating1, rating2):
    distance = 0
    for key in rating1:
        if key in rating2:          <span class="c"># sadece ortak öğeler</span>
            distance += abs(rating1[key] - rating2[key])
    return distance</pre>`}
 ],
 questions:[
  {type:'num', q:'P = (3, 4, 2) ve Q = (1, 4, 5) arasındaki Manhattan uzaklığı kaçtır?', ans:5, tol:0.01, exp:'|3−1| + |4−4| + |2−5| = 2 + 0 + 3 = 5.'},
  {type:'num', q:'Angelica ile Veronica arasındaki Manhattan uzaklığı kaçtır? (Veri tablosundan)', ans:3.5, tol:0.01, exp:'Ortak 5 grup: Blues Traveler 0,5 + Norah Jones 0,5 + Phoenix 1 + Slightly Stoopid 1 + The Strokes 0,5 = 3,5.'},
  {type:'num', q:'Jim (1, 4) ile Ms. X (4, 2) arasındaki Manhattan uzaklığı kaçtır?', ans:5, tol:0.01, exp:'|1−4| + |4−2| = 3 + 2 = 5.'},
  {type:'mcq', q:'Manhattan uzaklığının en büyük avantajı kitapta nasıl anlatılır?', opts:['Seyrek veride en iyi sonucu verir','Hesaplaması hızlıdır','Puan enflasyonunu düzeltir','Negatif değer alabilir'], ans:1, exp:'Kitap Facebook örneğini verir: 1 milyon kullanıcı arasında en benzer kişiyi ararken hız önemlidir.'},
  {type:'mcq', q:'manhattan() fonksiyonunda “if key in rating2” satırı ne işe yarar?', opts:['Uzaklığın karesini alır','Sadece iki kişinin de puanladığı öğeleri hesaba katar','Sonucu sıralar','Boş değerlere 0 atar'], ans:1, exp:'Biri puanlamadıysa o öğe karşılaştırılamaz, bu yüzden atlanır.'},
  {type:'num', q:'Chan ile Hailey arasındaki Manhattan uzaklığı kaçtır?', ans:4, tol:0.01, exp:'Ortak gruplar: Broken Bells |1−4| = 3, Deadmau5 |1−1| = 0, Norah Jones |3−4| = 1 → 4.'},
  {type:'mcq', q:'Manhattan’da uzaklık 0 çıkarsa bu ne anlama gelir?', opts:['Hiç benzer değiller','Ortak öğelerde puanları birebir aynı (ya da hiç ortak öğe yok)','Hesap hatası var','Pearson da 0’dır'], ans:1, exp:'Tüm farklar 0 ise toplam 0 olur. Kitaptaki minkowski() ortak öğe yoksa da 0 döndürür, buna dikkat etmek gerekir.'}
 ]
},
{
 id:'oklid', title:'Öklid uzaklığı', short:'Kuş uçuşu mesafe. Büyük farkları daha çok cezalandırır.',
 lead:'İki nokta arasındaki düz çizgi (kuş uçuşu) mesafedir; Pisagor teoreminin (c = √(a² + b²)) çok boyutlu halidir.',
 formula:'d(x, y) = √( (x₁ − x₂)² + (y₁ − y₂)² )     (2 boyut)<br>d(x, y) = √( Σ (xₖ − yₖ)² )              (n boyut)<small>Farkların karesi alındığı için tek bir büyük fark sonuca çok etki eder.</small>',

 formula:'d(x, y) = ( Σ |xₖ − yₖ|ʳ )^(1/r)<small>r = 1 → Manhattan · r = 2 → Öklid · r = ∞ → Supremum (en büyük tek fark). r büyüdükçe tek bir boyuttaki büyük fark toplam farkı daha çok etkiler.</small>',

{
 id:'pearson', title:'Pearson korelasyon katsayısı', short:'Puan enflasyonunu düzeltir; −1 ile +1 arası.',
 lead:'Pearson, iki kişinin puanlarının aynı yönde birlikte hareket edip etmediğini ölçer. Biri her şeye 4–5, diğeri 1–5 verse bile sıralamaları aynıysa Pearson tam uyum (1) gösterir.',
 formula:'r = (Σxy − Σx·Σy / n) / ( √(Σx² − (Σx)²/n) · √(Σy² − (Σy)²/n) )<small>Tek geçişli (single-pass) yaklaşık formül. Asıl formül Σ(x−x̄)(y−ȳ) / (√Σ(x−x̄)² · √Σ(y−ȳ)²) birden çok geçiş ister. Yaklaşık formül sayısal olarak kararsızdır (numerically unstable). Büyük r = daha benzer.</small>',
 when:['Puan enflasyonu (grade inflation): kullanıcılar ölçeği farklı kullanıyor','Bill uçlardan kaçınıyor (2–4), Jordyn her şeyi seviyor (4–5), Hailey ya 1 ya 4 veriyor','Hailey’nin 4’ü, Jordyn’in 4’ünden çok 5’ine benziyor'],
 whenNot:['Ortak öğe çok azsa (2 öğede sonuç yanıltıcı)','Bir kişinin ortak puanları hep aynıysa payda 0 olur → fonksiyon 0 döndürür','Veri çok seyrekse Kosinüs düşünülmeli'],
 qtypes:['“Clara ile Robert’ın Pearson’ını adım adım hesaplayın”','“pearson(Angelica, Bill) kaçtır?”','“Grafikte noktalar düz çizgideyse r kaçtır?”','“Pearson hangi problemi çözer?”'],
 calc:'pair', calcDefault:['4.75, 4.5, 5, 4.25, 4','4, 3, 5, 2, 1'], calcMetric:'pearson',
 examples:[
  {t:'Clara ve Robert, adım adım', src:'PDF s. 2-25 … 2-28', b:`<table class="t"><tr><th></th><th class="n">Blues T.</th><th class="n">Norah J.</th><th class="n">Phoenix</th><th class="n">Strokes</th><th class="n">Weird Al</th></tr>
  <tr><td>Clara (x)</td><td class="n">4,75</td><td class="n">4,5</td><td class="n">5</td><td class="n">4,25</td><td class="n">4</td></tr>
  <tr><td>Robert (y)</td><td class="n">4</td><td class="n">3</td><td class="n">5</td><td class="n">2</td><td class="n">1</td></tr></table>
  <div class="step">Σxy           = 19 + 13,5 + 25 + 8,5 + 4 = 70
Σx·Σy / n     = 22,5 × 15 / 5 = 67,5
Pay           = 70 − 67,5 = 2,5
√(Σx² − (Σx)²/n) = √(101,875 − 101,25) = √0,625 = 0,79057
√(Σy² − (Σy)²/n) = √(55 − 45) = √10 = 3,162277
r             = 2,5 / (0,79057 × 3,162277) = 2,5 / 2,5 = 1,00</div>
  Clara’nın puanları 4–5 arasında sıkışmış. Yine de ikisi grupları aynı sırayla sevmiş, bu yüzden <b>tam uyum</b> var.`},
  {t:'Grafikte uyum derecesi', src:'PDF s. 2-22, 2-23', b:`Clara’nın puanları dikey eksende, Robert’ınkiler yatay eksende gösterilir:
  <table class="t"><tr><th>Grafik</th><th class="n">Pearson</th></tr>
  <tr><td>Noktalar tam düz çizgide (Perfect Agreement)</td><td class="n">1</td></tr>
  <tr><td>Pretty Good Agreement</td><td class="n">0,91</td></tr>
  <tr><td>Not So Good Agreement</td><td class="n">0,81</td></tr></table>`},
  {t:'Exercise: Angelica ile diğerleri', src:'PDF s. 2-29', b:`<div class="step">&gt;&gt;&gt; pearson(users['Angelica'], users['Bill'])
-0.904…     ← neredeyse tam ters zevk
&gt;&gt;&gt; pearson(users['Angelica'], users['Hailey'])
0.420…
&gt;&gt;&gt; pearson(users['Angelica'], users['Jordyn'])
0.763…      ← en benzer</div>`},
  {t:'Yeni örnek: cimri ve cömert puanlayıcı', src:'Alıştırma', b:`Ece (2, 3, 4), Can (4, 4,5, 5)
  <div class="step">Σx = 9, Σy = 13,5, Σxy = 41,5, n = 3
Pay   = 41,5 − 9 × 13,5 / 3 = 1
Payda = √(29 − 27) × √(61,25 − 60,75) = 1,414 × 0,707 = 1
r     = 1</div>Manhattan’a göre aralarındaki uzaklık 4,5 ve “uzak” görünürler. Pearson ise zevklerinin birebir aynı olduğunu gösterir.`},
  {t:'Yeni örnek: tam ters zevk', src:'Alıştırma', b:`x = (1, 2, 3), y = (3, 2, 1)<div class="step">Σxy = 3 + 4 + 3 = 10;  Σx·Σy/n = 6·6/3 = 12  → Pay = −2
Payda = √(14 − 12) · √(14 − 12) = 2
r = −1</div>`},
  {t:'pearson() fonksiyonu', src:'PDF s. 2-30', b:`<pre class="code">def pearson(rating1, rating2):
    sum_xy = sum_x = sum_y = sum_x2 = sum_y2 = n = 0
    for key in rating1:
        if key in rating2:
            n += 1
            x, y = rating1[key], rating2[key]
            sum_xy += x * y; sum_x += x; sum_y += y
            sum_x2 += x**2;  sum_y2 += y**2
    if n == 0: return 0                     <span class="c"># ortak puan yok</span>
    denominator = sqrt(sum_x2 - (sum_x**2)/n) * sqrt(sum_y2 - (sum_y**2)/n)
    if denominator == 0: return 0           <span class="c"># sıfıra bölme</span>
    return (sum_xy - (sum_x * sum_y)/n) / denominator</pre>`}

function runPair(m){
  const x=parseVec(document.getElementById('cx').value),y=parseVec(document.getElementById('cy').value);
  const out=document.getElementById('cout');
  if(x.length!==y.length){out.innerHTML='<div class="note">İki listenin uzunluğu aynı olmalı ('+x.length+' ve '+y.length+').</div>';return}
  let rows='',res='',steps='';
  if(m==='cosine'){
    let dot=0,nx=0,ny=0;x.forEach((a,i)=>{a=a||0;const b=y[i]||0;dot+=a*b;nx+=a*a;ny+=b*b;rows+=`<tr><td class="n">${i+1}</td><td class="n">${f(a)}</td><td class="n">${f(b)}</td><td class="n">${f(a*b)}</td><td class="n">${f(a*a)}</td><td class="n">${f(b*b)}</td></tr>`});
    const cs=dot/Math.sqrt(nx*ny);
    out.innerHTML=`<table class="t"><tr><th class="n">#</th><th class="n">x</th><th class="n">y</th><th class="n">x·y</th><th class="n">x²</th><th class="n">y²</th></tr>${rows}</table>
    <div class="step">x·y = ${f(dot)}   ‖x‖ = √${f(nx)} = ${f(Math.sqrt(nx))}   ‖y‖ = √${f(ny)} = ${f(Math.sqrt(ny))}
cos = ${f(dot)} / (${f(Math.sqrt(nx))} × ${f(Math.sqrt(ny))})</div>Sonuç: <span class="pill">cos = ${f(cs,4)}</span>`;return;
  }
  if(m==='manhattanZero'){
    let dz=0,dc=0,n=0;x.forEach((a,i)=>{const b=y[i];dz+=Math.abs((a||0)-(b||0));if(a&&b){dc+=Math.abs(a-b);n++}});
    out.innerHTML=`<table class="t"><tr><th>Yorum</th><th class="n">Manhattan</th></tr><tr><td>0 = gerçek puan (sıfır atama)</td><td class="n">${f(dz)}</td></tr><tr><td>0 = puanlanmamış (sadece ${n} ortak öğe)</td><td class="n">${f(dc)}</td></tr><tr><td>Ortalama uzaklık (ortak öğelere böl)</td><td class="n">${n?f(dc/n):'—'}</td></tr></table>
    <div class="note">Varsayılan değerler Jake ile Kelsey’ye ait: sıfır atamayla 32, ortak öğelerle sadece 1 çıkar.</div>`;return;
  }
  const px=[],py=[];x.forEach((a,i)=>{const b=y[i];const common=a!==null&&b!==null&&!isNaN(a)&&!isNaN(b);
    rows+=`<tr${common?'':' style="color:#aaa"'}><td class="n">${i+1}</td><td class="n">${a===null?'–':f(a)}</td><td class="n">${b===null?'–':f(b)}</td><td class="n">${common?f(Math.abs(a-b)):''}</td><td class="n">${common?f((a-b)**2):''}</td></tr>`;
    if(common){px.push(a);py.push(b)}});
  const diffs=px.map((a,i)=>Math.abs(a-py[i]));
  if(!px.length){out.innerHTML='<div class="note">Ortak öğe yok.</div>';return}
  const tab=`<table class="t"><tr><th class="n">#</th><th class="n">x</th><th class="n">y</th><th class="n">|x−y|</th><th class="n">(x−y)²</th></tr>${rows}</table>`;
  if(m==='manhattan'){res=`<div class="step">d = ${diffs.map(d=>f(d)).join(' + ')} = ${f(diffs.reduce((a,b)=>a+b,0))}</div>Sonuç: <span class="pill">Manhattan = ${f(diffs.reduce((a,b)=>a+b,0))}</span> · Öklid ile karşılaştır: ${f(Math.sqrt(diffs.reduce((a,b)=>a+b*b,0)))}`}
  if(m==='euclid'){const ss=diffs.reduce((a,b)=>a+b*b,0);res=`<div class="step">d = √(${diffs.map(d=>f(d*d)).join(' + ')}) = √${f(ss)}</div>Sonuç: <span class="pill">Öklid = ${f(Math.sqrt(ss))}</span> · Manhattan ile karşılaştır: ${f(diffs.reduce((a,b)=>a+b,0))}`}
  if(m==='minkowski'){const rs=document.getElementById('cr').value.trim().toLowerCase();const r=(rs==='inf'||rs==='∞')?Infinity:parseFloat(rs.replace(',','.'));
    const mk=rr=>rr===Infinity?Math.max(...diffs):Math.pow(diffs.reduce((a,b)=>a+Math.pow(b,rr),0),1/rr);
    res=`<table class="t"><tr><th>r</th><th class="n">Sonuç</th></tr><tr><td>1 (Manhattan)</td><td class="n">${f(mk(1))}</td></tr><tr><td>2 (Öklid)</td><td class="n">${f(mk(2))}</td></tr><tr class="hl"><td>${r===Infinity?'∞':f(r)} (seçtiğin)</td><td class="n">${isFinite(mk(r))?f(mk(r)):'—'}</td></tr><tr><td>∞ (Supremum)</td><td class="n">${f(mk(Infinity))}</td></tr></table>`}
  if(m==='pearson'){const n=px.length,sx=px.reduce((a,b)=>a+b,0),sy=py.reduce((a,b)=>a+b,0),sxy=px.reduce((a,b,i)=>a+b*py[i],0),sx2=px.reduce((a,b)=>a+b*b,0),sy2=py.reduce((a,b)=>a+b*b,0);
    const num=sxy-sx*sy/n,d1=Math.sqrt(sx2-sx*sx/n),d2=Math.sqrt(sy2-sy*sy/n),r=(d1*d2)?num/(d1*d2):0;
    res=`<div class="step">n = ${n}   Σx = ${f(sx)}   Σy = ${f(sy)}   Σxy = ${f(sxy)}   Σx² = ${f(sx2)}   Σy² = ${f(sy2)}
Pay   = ${f(sxy)} − ${f(sx)}×${f(sy)}/${n} = ${f(num)}
Payda = √(${f(sx2)} − ${f(sx*sx/n)}) × √(${f(sy2)} − ${f(sy*sy/n)}) = ${f(d1)} × ${f(d2)} = ${f(d1*d2)}</div>${d1*d2?'':'<div class="note">Payda 0, kitaptaki fonksiyon bu durumda 0 döndürür.</div>'}Sonuç: <span class="pill">r = ${f(r,4)}</span>`;
    out.innerHTML=res;return}
  out.innerHTML=tab+res;
}
function runKnn(){
  const lines=document.getElementById('kin').value.split('\n').map(l=>l.split(',').map(s=>s.trim())).filter(a=>a.length>=3);
  const P=lines.map(a=>({n:a[0],p:parseFloat(a[1]),r:parseFloat(a[2])})).filter(o=>isFinite(o.p)&&isFinite(o.r));
  const sum=P.reduce((a,b)=>a+b.p,0);let pred=0;
  const rows=P.map(o=>{const w=o.p/sum;pred+=o.r*w;return `<tr><td>${o.n}</td><td class="n">${f(o.p)}</td><td class="n">${f(w*100,1)}%</td><td class="n">${f(o.r)}</td><td class="n">${f(o.r*w)}</td></tr>`}).join('');
  document.getElementById('kout').innerHTML=`<table class="t"><tr><th>Kişi</th><th class="n">Pearson</th><th class="n">Etki</th><th class="n">Puan</th><th class="n">Puan×Etki</th></tr>${rows}<tr class="hl"><td>Toplam</td><td class="n">${f(sum)}</td><td class="n">100%</td><td></td><td class="n">${f(pred)}</td></tr></table>Tahmin: <span class="pill">${f(pred)}</span>`;
}
function runExplorer(){
  const u=document.getElementById('eu').value,m=document.getElementById('em').value,k=+document.getElementById('ek').value;
  const fn={manhattan:(a,b)=>minkowski(a,b,1),euclid:(a,b)=>minkowski(a,b,2),pearson,cosine}[m];
  const sim=m==='pearson'||m==='cosine';
  let list=NAMES.filter(n=>n!==u).map(n=>({n,d:fn(USERS[u],USERS[n])}));
  list.sort((a,b)=>sim?(b.d-a.d)||(a.n<b.n?-1:1):(a.d-b.d)||(a.n<b.n?-1:1));
  const near=list.slice(0,k);const tot=near.reduce((a,b)=>a+b.d,0);
  const rec={};
  if(k===1){const nb=USERS[near[0].n];for(const a in nb){if(!(a in USERS[u]))rec[a]=nb[a]}}
  else{near.forEach(o=>{const w=sim?o.d/tot:(1/k);const nb=USERS[o.n];for(const a in nb){if(!(a in USERS[u]))rec[a]=(rec[a]||0)+nb[a]*w}})}
  const recs=Object.entries(rec).sort((a,b)=>b[1]-a[1]);
  document.getElementById('eout').innerHTML=`<div class="grid2"><div><b>${u} için ${sim?'benzerlik':'uzaklık'} sırası</b> <span class="src">(${sim?'büyükten küçüğe':'küçükten büyüğe'})</span>
  <table class="t"><tr><th>Kişi</th><th class="n">${sim?'benzerlik':'uzaklık'}</th></tr>${list.map((o,i)=>`<tr class="${i<k?'hl':''}"><td>${o.n}</td><td class="n">${f(o.d)}</td></tr>`).join('')}</table></div>
  <div><b>Öneriler</b> <span class="src">(k = ${k}${k>1?(sim?', Pearson/kosinüs ağırlıklı':', eşit ağırlık'):''})</span>
  ${recs.length?`<table class="t"><tr><th>Grup</th><th class="n">skor</th></tr>${recs.map(r=>`<tr><td>${r[0]}</td><td class="n">${f(r[1])}</td></tr>`).join('')}</table>`:'<div class="note">Öneri yok: komşu(lar)ın puanladığı her grubu bu kullanıcı zaten puanlamış.</div>'}
  ${k>1?'<div class="src">Not: k&gt;1’de komşunun puanlamadığı öğe o komşudan katkı almaz (kitaptaki sınıfla aynı).</div>':''}</div></div>
  <details class="ex" style="margin-top:12px"><summary>Veri tablosunu göster</summary><div class="body">${ratingTable([u,...near.map(o=>o.n)])}</div></details>`;
}

/* ---------- yönlendirme ---------- */
function go(id){if(location.hash!=='#'+id)location.hash=id;else render()}
function render(){
  const id=(location.hash||'#home').slice(1);const idx=CATS.findIndex(c=>c.id===id);
  document.getElementById('nav').innerHTML=navHTML(idx<0?'home':id);
  document.getElementById('main').innerHTML=idx<0?home():catHTML(CATS[idx],idx);
  document.querySelector('nav').classList.remove('open');
  updateTotals();window.scrollTo(0,0);
  if(idx>=0){const c=CATS[idx];if(c.calc==='pair')runPair(c.calcMetric);if(c.calc==='knn')runKnn();if(c.calc.startsWith('explorer'))runExplorer()}
}
window.addEventListener('hashchange',render);
render();
</script>
